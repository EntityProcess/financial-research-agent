schema: agentv-targets-v2.2

targets:
  - name: default
    use_target: "${{ AGENT_TARGET }}"

  - name: financial-research-agent
    provider: codex
    executable: "${{ CODEX_EXECUTABLE }}"
    model: "${{ CODEX_MODEL }}"
    model_reasoning_effort: "${{ CODEX_REASONING_EFFORT }}"
    cwd: "${{ CODEX_WORKSPACE_DIR }}"
    log_dir: "${{ CODEX_LOG_DIR }}"
    stream_log: raw
    grader_target: grader
    system_prompt: &financial_research_system_prompt |
      You are the public financial-research target agent for this AgentV harness.
      Follow the reusable behavior contract documented in `prompts/financial-research-system.md`,
      `workflows/public-benchmark-answer.md`, and the skill cards under `skills/`.

      Source boundary:
      - Use public web, SEC, company investor-relations, exchange, and reputable news sources.
      - Cite the evidence you rely on when possible, including source names and dates for time-sensitive facts.
      - Do not use Dexter, Financial Datasets, private data, API keys, paid market-data services,
        or benchmark golden answers as answer sources. Dexter is fixture provenance only.

      Workflow:
      1. Classify the ask: reported metric/KPI, guidance beat-miss, business event, trend/comparison,
         filing content, valuation, memo/thesis, or sentiment.
      2. Gather the smallest set of primary evidence that can answer it. Prefer company disclosures,
         filings, earnings materials, and regulator/exchange records before secondary sources.
      3. Search efficiently with complete natural-language queries; fetch full pages or filing sections
         only when snippets are insufficient; parallelize independent sub-questions when available.
      4. Normalize fiscal periods, units, currencies, share counts, and bps vs percentage-point language
         before calculating. Show formulas for non-trivial calculations.
      5. Cross-check material numeric or event claims. If sources conflict, state the source used and why.
      6. Return a concise answer in the requested format, focused on the numeric facts and business
         events asked for. Do not add a memo or investment recommendation unless asked.

  - name: codex
    provider: codex
    executable: "${{ CODEX_EXECUTABLE }}"
    model: "${{ CODEX_MODEL }}"
    model_reasoning_effort: "${{ CODEX_REASONING_EFFORT }}"
    cwd: "${{ CODEX_WORKSPACE_DIR }}"
    log_dir: "${{ CODEX_LOG_DIR }}"
    stream_log: raw
    grader_target: grader
    system_prompt: *financial_research_system_prompt

  - name: dexter-agent
    provider: cli
    command: bun run ./scripts/run-dexter-agent.ts --prompt {PROMPT} --output {OUTPUT_FILE}
    cwd: ..
    timeout_ms: 900000
    grader_target: grader
    healthcheck:
      command: bun run ./scripts/setup.ts --check-only
      cwd: ..
      timeout_ms: 30000

  - name: grader
    use_target: "${{ GRADER_TARGET }}"

  - name: openai-grader
    provider: openai
    base_url: "${{ OPENAI_BASE_URL }}"
    api_key: "${{ OPENAI_API_KEY }}"
    model: "${{ OPENAI_MODEL }}"

  - name: azure-grader
    provider: azure
    endpoint: "${{ AZURE_OPENAI_ENDPOINT }}"
    api_key: "${{ AZURE_OPENAI_API_KEY }}"
    model: "${{ AZURE_DEPLOYMENT_NAME }}"
    version: "${{ AZURE_OPENAI_API_VERSION }}"

  - name: azure
    provider: openai
    base_url: "${{ AZURE_OPENAI_RESPONSES_BASE_URL }}"
    api_key: "${{ AZURE_OPENAI_API_KEY }}"
    model: "${{ AZURE_DEPLOYMENT_NAME }}"
    api_format: responses
